<!DOCTYPE html>
<html lang="pap">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticia y Actividadnan - AHM Koor Aruba</title>

    <link rel="icon" type="image/png" sizes="192x192" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-2-32x32.png">
    <link rel="icon" size="48x48" href="/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const THEMES = {
            emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
            violet: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95', 950: '#2e1065' },
            rose: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af', 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337', 950: '#4c0519' },
            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f', 950: '#451a03' }
        };
        const savedTheme = localStorage.getItem('theme_color') || 'emerald';
        tailwind.config = { theme: { extend: { colors: { emerald: THEMES[savedTheme] } } } };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Loading Spinner */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #d1fae5;
            /* Light Emerald */
            border-top: 4px solid #059669;
            /* Dark Emerald */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-stone-50 text-stone-900">

    <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-lg border-b border-emerald-800">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-full"><i data-lucide="music" class="text-emerald-900 w-5 h-5"></i>
                </div>
                <a href="index.html" class="font-serif text-xl md:text-2xl font-bold">Koor AHM</a>
            </div>
            <div class="hidden md:flex items-center gap-6">
                <a href="/" class="hover:text-emerald-300">Home</a>
                <a href="/calendar" class="hover:text-emerald-300">Kalender</a>
                <a href="/contact" class="hover:text-emerald-300">Contacto</a>
                <a href="/news" class="hover:text-emerald-300 text-emerald-300 font-bold">Noticia</a>
            </div>
            <button class="md:hidden p-2" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"><i
                    data-lucide="menu"></i></button>
        </div>
        <div id="mobile-menu" class="hidden bg-emerald-800 md:hidden px-4 py-6 space-y-4">
            <a href="/" class="block text-lg">Home</a>
            <a href="/calendar" class="block text-lg">Kalender</a>
            <a href="/contact" class="block text-lg">Contacto</a>
            <a href="/news" class="block text-lg font-bold">Noticia</a>
        </div>
    </nav>

    <div class="py-12 md:py-20 px-4 max-w-5xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-3xl md:text-5xl font-bold text-stone-800 mb-4">Noticia y Actividadnan</h1>
            <p class="text-stone-500">Keda na altura di loke nos ta haci.</p>
        </header>

        <div id="news-container" class="grid md:grid-cols-2 gap-8">
            <p class="text-center col-span-2 text-stone-400">loading...</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const API_BASE = "https://api.ahmkoor.com/api";

        async function loadNews() {
            const container = document.getElementById('news-container');

            // 1. Show Loader
            container.innerHTML = `
                <div class="col-span-2 flex flex-col items-center justify-center py-12">
                    <div class="spinner mb-4"></div>
                    <p class="text-stone-400 text-sm animate-pulse">Warda un rato, nos ta conectando...</p>
                </div>
            `;

            try {
                const res = await fetch(`${API_BASE}/news`);
                const news = await res.json();

                if (news.length === 0) {
                    container.innerHTML = '<p class="col-span-2 text-center text-stone-400 py-10">Ainda no tin noticia.</p>';
                    return;
                }

                container.innerHTML = news.map(post => `
                    <div class="bg-white rounded-3xl shadow-md overflow-hidden border border-stone-100 flex flex-col h-full hover:shadow-xl transition-shadow">
                        ${post.image ? `<div class="h-48 md:h-64 overflow-hidden"><img src="${post.image}" class="w-full h-full object-cover"></div>` : ''}
                        <div class="p-6 flex flex-col flex-grow">
                            <p class="text-xs font-bold text-emerald-600 mb-2 uppercase tracking-widest">${post.date}</p>
                            <h2 class="text-xl font-bold text-stone-800 mb-3 font-serif">${post.title}</h2>
                            <p class="text-stone-600 text-sm leading-relaxed flex-grow">${post.content}</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p class="col-span-2 text-center text-red-400 py-10">Server is waking up. Please refresh in a moment.</p>';
            }
        }
        window.onload = () => { loadNews(); lucide.createIcons(); };
    </script>
</body>

</html>
