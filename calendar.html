<!DOCTYPE html>
<html lang="pap">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>Kalender di Presentacion - AHM Koor Aruba</title>
    <meta name="title" content="Kalender di Presentacion - AHM Koor Aruba">
    <meta name="description" content="Mira nos proximo misa y conciertonan na Aruba. Keda al tanto di unda AHM Koor lo ta presente pa celebra musica sagrado na Birgen di Fatima y rond di e isla.">
    <meta name="keywords" content="AHM Koor kalender, misa Aruba, concierto Dakota, musica sagrado Aruba">
    <link rel="canonical" href="https://ahmkoor.com/calendar" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ahmkoor.com/calendar.html">
    <meta property="og:title" content="Kalender di Presentacion - AHM Koor Aruba">
    <meta property="og:description" content="Descubri unda nos ta toca y uni cu nos den un celebrashon di musica y fe.">
    <meta property="og:image" content="https://ahmkoor.com/images/closeup.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-2-32x32.png">
    <link rel="icon" size="48x48" href="/favicon.ico">

    <!-- Fonts & Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900">
    <!-- Navbar (Matches Home Page) -->
    <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-lg border-b border-emerald-800">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-full"><i data-lucide="music" class="text-emerald-900 w-5 h-5"></i></div>
                <a href="index.html" class="font-serif text-xl md:text-2xl font-bold">Koor AHM</a>
            </div>
            
            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center gap-6">
                <a href="/" class="hover:text-emerald-300" data-t="home">Home</a>
                <a href="/calendar" class="hover:text-emerald-300 text-emerald-300 font-bold" data-t="calendar">Kalender</a>
                <a href="/contact" class="hover:text-emerald-300" data-t="contact">Contacto</a>
                <select id="langSelect" class="bg-emerald-800 text-white text-xs p-1 rounded lang-selector">
                    <option value="pap">PAP</option><option value="en">EN</option><option value="es">ES</option>
                </select>
            </div>

            <!-- Mobile Toggle -->
            <button class="md:hidden p-2" onclick="toggleMenu()">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>

        <!-- Mobile Menu Links -->
        <div id="mobile-menu" class="hidden bg-emerald-800 border-t border-emerald-700 md:hidden px-4 py-6 space-y-4">
            <a href="/" class="block text-lg" data-t="home">Home</a>
            <a href="/calendar" class="block text-lg font-bold" data-t="calendar">Kalender</a>
            <a href="/contact" class="block text-lg" data-t="contact">Contacto</a>
            <select id="langSelectMobile" class="bg-emerald-900 text-white p-2 rounded w-full lang-selector">
                <option value="pap">PAP</option><option value="en">EN</option><option value="es">ES</option>
            </select>
        </div>
    </nav>

    <!-- Content Header -->
    <div class="py-12 md:py-20 px-4 max-w-5xl mx-auto">
        <header class="text-center mb-12 md:mb-20">
            <div class="inline-flex items-center justify-center p-3 bg-white rounded-2xl shadow-sm mb-6 border border-stone-100">
                <i data-lucide="calendar" class="text-emerald-700 w-8 h-8"></i>
            </div>
            <h1 class="text-3xl md:text-5xl font-bold text-stone-800 mb-4 md:mb-6" data-t="calendar_title">Kalender di Presentacion</h1>
            <p class="text-lg md:text-xl text-stone-600 max-w-2xl mx-auto font-light" data-t="calendar_subtitle">Descubri unda nos ta toca y uni cu nos den un celebrashon di musica y fe.</p>
            <div class="w-16 h-1 bg-emerald-600 mx-auto mt-6 md:mt-8"></div>
        </header>

        <!-- Events list (Populated by main.js) -->
        <div id="events-list" class="space-y-6 md:space-y-8">
            <!-- JavaScript will inject cards here -->
        </div>

        <!-- Simple Mobile CTA -->
        <div class="mt-16 text-center bg-emerald-950 p-8 md:p-12 rounded-[2rem] text-white">
            <h2 class="text-2xl font-serif mb-4">Mensahe</h2>
            <p class="text-emerald-100 mb-8 opacity-80 text-sm md:text-base">Kier pa nos canta na bo misa of evento especial?</p>
            <a href="/contact" class="inline-block bg-emerald-600 px-8 py-3 rounded-full font-bold hover:bg-emerald-500 transition-colors" data-t="contact_title">Tuma Contacto</a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
