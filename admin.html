<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>AHM Admin Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: system-ui, sans-serif; }</style>
</head>
<body class="bg-stone-100 min-h-screen">

    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-10 rounded-2xl shadow-xl max-w-sm w-full">
            <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">Admin Login</h1>
            <input type="password" id="admin-password" placeholder="Password" class="w-full p-3 border rounded mb-4">
            <button onclick="login()" class="w-full py-3 bg-slate-900 text-white rounded font-bold">Login</button>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden">
        <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto flex flex-wrap gap-4 justify-between items-center">
                <h1 class="text-xl font-bold">AHM Admin</h1>
                <div class="flex gap-2">
                    <button onclick="showTab('events')" id="nav-events" class="px-3 py-1 rounded hover:bg-slate-700">Eventos</button>
                    <button onclick="showTab('news')" id="nav-news" class="px-3 py-1 rounded hover:bg-slate-700">Noticia</button>
                    <button onclick="showTab('settings')" id="nav-settings" class="px-3 py-1 rounded hover:bg-slate-700">Settings</button>
                </div>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto p-4 md:p-8">

            <div id="tab-events" class="tab-content">
                <h2 class="text-2xl font-bold mb-4">Eventos</h2>
                <p class="text-sm text-gray-500 mb-4">Use the existing event controls here.</p>
                 <button onclick="window.location.reload()" class="underline">Reload to manage events</button>
            </div>

            <div id="tab-news" class="tab-content hidden">
                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 class="text-xl font-bold mb-4 text-slate-800">Post Noticia</h2>
                            <form id="addNewsForm" class="space-y-4">
                                <input type="text" id="news-title" placeholder="Titulo" required class="w-full p-3 border rounded">
                                <input type="date" id="news-date" required class="w-full p-3 border rounded">
                                <textarea id="news-content" placeholder="E contenido..." rows="4" class="w-full p-3 border rounded"></textarea>

                                <div>
                                    <label class="block text-xs font-bold text-slate-500 mb-1">Image (Optional)</label>
                                    <input type="file" id="news-image" accept="image/*" class="w-full text-sm">
                                </div>

                                <button type="submit" id="news-submit-btn" class="w-full py-3 bg-blue-700 text-white rounded font-bold">Post News</button>
                            </form>
                        </div>
                    </div>

                    <div class="lg:col-span-2">
                        <h2 class="text-xl font-bold mb-4">Recent Posts</h2>
                        <div id="admin-news-list" class="space-y-4"></div>
                    </div>
                </div>
            </div>

            <div id="tab-settings" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-4">Settings</h2>
                <div class="bg-white p-6 rounded-2xl shadow-sm max-w-md">
                    <label class="block mb-2 font-bold">Liturgical Color</label>
                    <select id="sel-theme-color" class="w-full p-3 border rounded mb-4">
                        <option value="emerald">Green</option>
                        <option value="violet">Purple</option>
                        <option value="rose">Red</option>
                        <option value="amber">Gold</option>
                    </select>
                    <button onclick="saveSettings()" class="w-full py-3 bg-blue-700 text-white rounded font-bold">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://api.ahmkoor.com/api";
        const getToken = () => localStorage.getItem('admin_token');

        // Authentication & Tab Logic
        async function login() {
            const password = document.getElementById('admin-password').value;
            const res = await fetch(`${API_BASE}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password }) });
            if (res.ok) { localStorage.setItem('admin_token', (await res.json()).token); showDashboardUI(); } else { alert("Wrong password"); }
        }
        function showDashboardUI() { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('dashboard-screen').classList.remove('hidden'); loadNews(); }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            if(tab === 'news') loadNews();
            if(tab === 'settings') loadSettings();
        }

        async function authFetch(url, options = {}) {
            if (!options.headers) options.headers = {};
            options.headers['Content-Type'] = 'application/json';
            const token = getToken();
            if (token) options.headers['Authorization'] = `Bearer ${token}`;
            return fetch(url, options);
        }

        // --- NEWS LOGIC ---
        async function loadNews() {
            const res = await fetch(`${API_BASE}/news`);
            const news = await res.json();
            const list = document.getElementById('admin-news-list');
            list.innerHTML = news.map(n => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex gap-4 items-start">
                    ${n.image ? `<img src="${n.image}" class="w-16 h-16 object-cover rounded-lg">` : '<div class="w-16 h-16 bg-slate-100 rounded-lg flex items-center justify-center text-slate-300">No Img</div>'}
                    <div class="flex-grow">
                        <h3 class="font-bold text-slate-800">${n.title}</h3>
                        <p class="text-xs text-slate-500">${n.date}</p>
                        <p class="text-sm text-slate-600 truncate">${n.content}</p>
                    </div>
                    <button onclick="deleteNews(${n.id})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        document.getElementById('addNewsForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('news-submit-btn');
            btn.innerText = "Uploading..."; btn.disabled = true;

            const title = document.getElementById('news-title').value;
            const date = document.getElementById('news-date').value;
            const content = document.getElementById('news-content').value;
            const fileInput = document.getElementById('news-image');

            let imageBase64 = null;
            if (fileInput.files.length > 0) {
                imageBase64 = await resizeImage(fileInput.files[0]);
            }

            const res = await authFetch(`${API_BASE}/admin/news`, {
                method: 'POST',
                body: JSON.stringify({ title, date, content, image: imageBase64 })
            });

            if (res.ok) {
                document.getElementById('addNewsForm').reset();
                loadNews();
            } else { alert("Error uploading"); }
            btn.innerText = "Post News"; btn.disabled = false;
        };

        async function deleteNews(id) {
            if(!confirm("Delete this news?")) return;
            await authFetch(`${API_BASE}/admin/news/${id}`, { method: 'DELETE' });
            loadNews();
        }

        // Helper: Resize Image & Convert to Base64
        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 800; // Limit size
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); // Compress to 70% quality
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // --- SETTINGS ---
        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/content`);
                const data = await res.json();
                document.getElementById('sel-theme-color').value = data.theme_color || "emerald";
            } catch(e){}
        }
        async function saveSettings() {
            const color = document.getElementById('sel-theme-color').value;
            await authFetch(`${API_BASE}/content`, { method: 'POST', body: JSON.stringify({ theme_color: color }) });
            alert("Updated!");
        }

        window.onload = () => { if (getToken()) document.getElementById('login-screen').classList.add('hidden'); document.getElementById('dashboard-screen').classList.remove('hidden'); lucide.createIcons(); };
    </script>
</body>
</html>
