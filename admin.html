<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHM Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-stone-100 min-h-screen">
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-xl max-w-sm w-full border text-center">
            <h1 class="text-2xl font-bold mb-6">Admin Login</h1>
            <input type="password" id="admin-password" placeholder="Password" class="w-full p-4 border rounded-xl mb-4 outline-none">
            <button onclick="login()" class="w-full py-4 bg-emerald-900 text-white rounded-xl font-bold">Login</button>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden">
        <nav class="bg-emerald-900 text-white p-6 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h1 class="font-bold">AHM Admin</h1>
                <div class="flex gap-6">
                    <button onclick="showTab('events')">Events</button>
                    <button onclick="showTab('messages')">Inbox</button>
                    <button onclick="logout()" class="text-red-300">Logout</button>
                </div>
            </div>
        </nav>
        <div class="max-w-6xl mx-auto p-6">
            <div id="tab-events" class="tab-content">
                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="bg-white p-6 rounded-3xl shadow border h-fit sticky top-28">
                        <h2 class="font-bold mb-4">Add Event</h2>
                        <form id="addEventForm" class="space-y-4">
                            <input type="text" id="ev-title" placeholder="Title" required class="w-full p-2 border rounded">
                            <input type="date" id="ev-date" required class="w-full p-2 border rounded">
                            <input type="time" id="ev-time" required class="w-full p-2 border rounded">
                            <input type="text" id="ev-location" placeholder="Location" required class="w-full p-2 border rounded">
                            <textarea id="ev-description" placeholder="Description" class="w-full p-2 border rounded"></textarea>
                            <button type="submit" class="w-full py-3 bg-emerald-700 text-white rounded-xl font-bold">Save</button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 space-y-8">
                        <div>
                            <h2 class="font-bold text-lg mb-4">Upcoming</h2>
                            <div id="admin-events-list" class="space-y-3"></div>
                        </div>
                        <div class="pt-8 border-t">
                            <h2 class="font-bold text-stone-400 mb-4">Archive</h2>
                            <div id="admin-archive-list" class="space-y-3 opacity-60"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="tab-messages" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-6">Inbox</h2>
                <div id="admin-messages-list" class="grid md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://YOUR_AZURE_APP_NAME.azurewebsites.net/api";
        const getToken = () => localStorage.getItem('admin_token');

        async function authFetch(url, options = {}) {
            if (!options.headers) options.headers = {};
            options.headers['Content-Type'] = 'application/json';
            const token = getToken();
            if (token) options.headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(url, options);
            if (res.status === 401) logout();
            return res;
        }

        async function login() {
            const password = document.getElementById('admin-password').value;
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password })
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('admin_token', data.token);
                location.reload();
            } else { alert("Unauthorized"); }
        }

        function logout() { localStorage.removeItem('admin_token'); location.reload(); }
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        async function loadEvents() {
            const res = await authFetch(`${API_BASE}/admin/all-events`);
            const events = await res.json();
            const today = new Date().toISOString().split('T')[0];
            const upList = document.getElementById('admin-events-list');
            const arcList = document.getElementById('admin-archive-list');
            let upHtml = "", arcHtml = "";
            events.forEach(e => {
                const html = `<div class="bg-white p-4 rounded-xl shadow border flex justify-between items-center"><div><p class="font-bold ${e.is_canceled ? 'line-through text-red-400' : ''}">${e.title}</p><p class="text-xs text-stone-500">${e.date} | ${e.time}</p></div><div class="flex gap-2"><button onclick="toggleCancel(${e.id}, ${!e.is_canceled})" class="p-1 bg-stone-100 rounded"><i data-lucide="slash" class="w-4 h-4"></i></button><button onclick="deleteEvent(${e.id})" class="p-1 bg-stone-100 rounded text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
                if (e.date >= today) upHtml += html; else arcHtml += html;
            });
            upList.innerHTML = upHtml || '<p class="text-xs italic text-stone-400">None</p>';
            arcList.innerHTML = arcHtml || '<p class="text-xs italic text-stone-400">None</p>';
            lucide.createIcons();
        }

        async function loadMessages() {
            const res = await authFetch(`${API_BASE}/admin/messages`);
            const msgs = await res.json();
            const list = document.getElementById('admin-messages-list');
            list.innerHTML = msgs.map(m => `<div class="bg-white p-5 rounded-2xl shadow border"><div class="flex justify-between items-start mb-2"><p class="font-bold">${m.name}</p><button onclick="deleteMessage(${m.id})" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div><p class="text-sm text-stone-600">${m.message}</p><p class="text-[10px] text-stone-400 mt-2">${m.email} ${m.company ? '| ' + m.company : ''}</p></div>`).join('');
            lucide.createIcons();
        }

        async function deleteEvent(id) { if(confirm("Delete?")) { await authFetch(`${API_BASE}/admin/events/${id}`, {method:'DELETE'}); loadEvents(); } }
        async function deleteMessage(id) { if(confirm("Delete message?")) { await authFetch(`${API_BASE}/admin/messages/${id}`, {method:'DELETE'}); loadMessages(); } }
        async function toggleCancel(id, status) { await authFetch(`${API_BASE}/admin/events/${id}`, {method:'PUT', body: JSON.stringify({is_canceled: status})}); loadEvents(); }

        document.getElementById('addEventForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = { title: document.getElementById('ev-title').value, date: document.getElementById('ev-date').value, time: document.getElementById('ev-time').value, location: document.getElementById('ev-location').value, description: document.getElementById('ev-description').value, type: 'Mass' };
            await authFetch(`${API_BASE}/admin/events`, {method:'POST', body: JSON.stringify(data)});
            e.target.reset();
            loadEvents();
        };

        window.onload = () => { if (getToken()) { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('dashboard-screen').classList.remove('hidden'); loadEvents(); loadMessages(); } lucide.createIcons(); };
    </script>
</body>
</html>
