<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tell Google NOT to show this page in search results -->
    <meta name="robots" content="noindex, nofollow">

    <title>AHM Admin Dashboard</title>

    <!-- Favicon (So it still looks professional in your browser tabs) -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

    <!-- Fonts & Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-100 min-h-screen">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl max-w-sm w-full border border-stone-200">
            <div class="w-16 h-16 bg-emerald-900 text-white rounded-2xl flex items-center justify-center mb-6 mx-auto">
                <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold mb-6 text-center text-stone-800">Admin Login</h1>
            <input type="password" id="admin-password" placeholder="Password"
                class="w-full p-4 border border-stone-200 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
            <button onclick="login()" class="w-full py-4 bg-emerald-900 text-white rounded-xl font-bold shadow-lg hover:bg-emerald-800 transition-all">
                Login
            </button>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden">
        <!-- Navigation -->
        <nav class="bg-emerald-900 text-white p-6 sticky top-0 z-50 shadow-md">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <h1 class="text-xl font-bold">AHM Admin</h1>
                </div>
                <div class="flex gap-4 md:gap-8 items-center">
                    <button onclick="showTab('events')" class="text-sm font-medium hover:text-emerald-300">Evento</button>
                    <button onclick="showTab('messages')" class="text-sm font-medium hover:text-emerald-300">Inbox</button>
                    <button onclick="logout()" class="text-xs bg-red-900/50 px-3 py-1.5 rounded-lg font-bold text-red-100 hover:bg-red-800 transition-all">Logout</button>
                </div>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto p-4 md:p-8">

            <!-- EVENTS TAB -->
            <div id="tab-events" class="tab-content">

                <!-- Mobile Toggle Button for Form -->
                <div class="lg:hidden mb-6">
                    <button onclick="toggleMobileForm()" id="mobile-form-btn" class="w-full py-4 bg-white border-2 border-emerald-900 text-emerald-900 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i>
                        <span id="btn-text">Evento nobo</span>
                    </button>
                </div>

                <div class="grid lg:grid-cols-3 gap-8">

                    <!-- Form Sidebar -->
                    <div id="add-event-sidebar" class="hidden lg:block lg:col-span-1">
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-stone-200 lg:sticky lg:top-28">
                            <h2 class="text-xl font-bold mb-6 text-stone-800">Evento nobo</h2>
                            <form id="addEventForm" class="space-y-4">
                                <input type="text" id="ev-title" placeholder="Titulo di Evento" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                                <input type="date" id="ev-date" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                                <input type="time" id="ev-time" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                                <input type="text" id="ev-location" placeholder="Luga" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                                <textarea id="ev-description" placeholder="Descripcion" rows="3" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                <select id="ev-type" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                                    <option value="Mass">Mass</option>
                                    <option value="Concert">Concert</option>
                                    <option value="Special Service">Special Service</option>
                                </select>
                                <button type="submit" class="w-full py-4 bg-emerald-700 text-white rounded-xl font-bold shadow-lg hover:bg-emerald-600 transition-all">Save Evento</button>
                            </form>
                        </div>
                    </div>

                    <!-- Lists Area -->
                    <div class="lg:col-span-2 space-y-10">
                        <section>
                            <h2 class="text-xl font-bold mb-6 text-stone-800 flex items-center gap-2">
                                <i data-lucide="calendar-days" class="text-emerald-600 w-5 h-5"></i>
                                Eventonan Biniendo
                            </h2>
                            <div id="admin-events-list" class="space-y-4"></div>
                        </section>

                        <section class="pt-8 border-t border-stone-200">
                            <h2 class="text-lg font-bold mb-6 text-stone-400 flex items-center gap-2">
                                <i data-lucide="archive" class="w-4 h-4"></i>
                                Archive (Eventonan Bieu)
                            </h2>
                            <div id="admin-archive-list" class="space-y-3 opacity-70"></div>
                        </section>
                    </div>
                </div>
            </div>

            <!-- MESSAGES TAB -->
            <div id="tab-messages" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-8 text-stone-800 flex items-center gap-2">
                    <i data-lucide="mail" class="text-emerald-600 w-6 h-6"></i>
                    Inbox
                </h2>
                <div id="admin-messages-list" class="grid md:grid-cols-2 gap-4"></div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = "https://api.ahmkoor.com/api"; // Updated to your Render URL

        // --- MOBILE UI LOGIC ---
        function toggleMobileForm() {
            const sidebar = document.getElementById('add-event-sidebar');
            const btnText = document.getElementById('btn-text');
            const isHidden = sidebar.classList.contains('hidden');

            if (isHidden) {
                sidebar.classList.remove('hidden');
                btnText.innerText = "Close Form";
                sidebar.scrollIntoView({ behavior: 'smooth' });
            } else {
                sidebar.classList.add('hidden');
                btnText.innerText = "Add New Event";
            }
        }

        // --- AUTH LOGIC ---
        const getToken = () => localStorage.getItem('admin_token');

        async function authFetch(url, options = {}) {
            if (!options.headers) options.headers = {};
            options.headers['Content-Type'] = 'application/json';
            const token = getToken();
            if (token) options.headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(url, options);
            if (res.status === 401) logout();
            return res;
        }

        async function login() {
            const password = document.getElementById('admin-password').value;
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password })
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('admin_token', data.token);
                showDashboardUI();
            } else { alert("Wrong password"); }
        }

        function logout() { localStorage.removeItem('admin_token'); location.reload(); }

        function showDashboardUI() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            loadDashboardData();
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        function loadDashboardData() {
            loadEvents();
            loadMessages();
            lucide.createIcons();
        }

        async function loadEvents() {
            const res = await authFetch(`${API_BASE}/admin/all-events`);
            const events = await res.json();
            const today = new Date().toISOString().split('T')[0];
            const upList = document.getElementById('admin-events-list');
            const arcList = document.getElementById('admin-archive-list');

            let upHtml = "", arcHtml = "";
            events.forEach(e => {
                const isCanceled = e.is_canceled;
                const html = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center ${isCanceled ? 'bg-red-50 border-red-100' : 'border-stone-200'}">
                        <div class="flex gap-4 items-center">
                            <div class="text-center min-w-[50px]">
                                <p class="text-[10px] uppercase font-bold text-stone-400">${e.date.split('-')[1]}</p>
                                <p class="text-xl font-bold text-stone-800">${e.date.split('-')[2]}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-stone-800 text-sm md:text-base ${isCanceled ? 'line-through opacity-50' : ''}">${e.title}</h3>
                                <p class="text-[10px] md:text-xs text-stone-500">${e.location} | ${e.time}</p>
                            </div>
                        </div>
                        <div class="flex gap-1 md:gap-2">
                            <button onclick="toggleCancel(${e.id}, ${!isCanceled})" class="p-2 bg-stone-100 rounded-lg hover:bg-amber-100"><i data-lucide="slash" class="w-4 h-4 text-amber-600"></i></button>
                            <button onclick="deleteEvent(${e.id})" class="p-2 bg-stone-100 rounded-lg hover:bg-red-100"><i data-lucide="trash-2" class="w-4 h-4 text-red-500"></i></button>
                        </div>
                    </div>
                `;
                if (e.date >= today) upHtml += html; else arcHtml += html;
            });
            upList.innerHTML = upHtml || '<p class="text-stone-400 italic text-sm">No upcoming events.</p>';
            arcList.innerHTML = arcHtml || '<p class="text-stone-400 italic text-sm">None</p>';
            lucide.createIcons();
        }

        async function loadMessages() {
            const res = await authFetch(`${API_BASE}/admin/messages`);
            const msgs = await res.json();
            const list = document.getElementById('admin-messages-list');
            list.innerHTML = msgs.map(m => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200">
                    <div class="flex justify-between items-start mb-2">
                        <p class="font-bold text-stone-800 text-sm">${m.name}</p>
                        <button onclick="deleteMessage(${m.id})" class="text-red-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <p class="text-xs text-stone-600 mb-3">${m.message}</p>
                    <p class="text-[9px] text-stone-400 uppercase font-bold">${m.email} ${m.company ? '| ' + m.company : ''}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function deleteEvent(id) { if(confirm("Delete?")) { await authFetch(`${API_BASE}/admin/events/${id}`, {method:'DELETE'}); loadEvents(); } }
        async function deleteMessage(id) { if(confirm("Delete message?")) { await authFetch(`${API_BASE}/admin/messages/${id}`, {method:'DELETE'}); loadMessages(); } }
        async function toggleCancel(id, status) { await authFetch(`${API_BASE}/admin/events/${id}`, {method:'PUT', body: JSON.stringify({is_canceled: status})}); loadEvents(); }

        document.getElementById('addEventForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('ev-title').value,
                date: document.getElementById('ev-date').value,
                time: document.getElementById('ev-time').value,
                location: document.getElementById('ev-location').value,
                description: document.getElementById('ev-description').value,
                type: document.getElementById('ev-type').value
            };
            const res = await authFetch(`${API_BASE}/admin/events`, {method:'POST', body: JSON.stringify(data)});
            if (res.ok) {
                e.target.reset();
                if (window.innerWidth < 1024) toggleMobileForm(); // Hide form on mobile after saving
                loadEvents();
            }
        };

        window.onload = () => { if (getToken()) showDashboardUI(); lucide.createIcons(); };
    </script>
</body>
</html>
