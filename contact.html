<!DOCTYPE html>
<html lang="pap">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>Contacto - AHM Koor Aruba</title>
    <meta name="title" content="Contacto - AHM Koor Aruba">
    <meta name="description" content="Kier pa AHM Koor canta na bo misa, casamiento, of evento especial? Tuma contacto cu nos pa reservashon of pa uni cu nos grupo na Dakota.">
    <meta name="keywords" content="AHM Koor contacto, reserva koor Aruba, uni cu koor, Dakota Aruba">
    <link rel="canonical" href="https://ahmkoor.com/contact.html" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ahmkoor.com/contact.html">
    <meta property="og:title" content="Tuma Contacto cu AHM Koor">
    <meta property="og:description" content="Manda nos un mensahe pa reservashonnan of informacion pa uni cu nos koor.">
    <meta property="og:image" content="https://ahmkoor.com/images/closeup.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-2-32x32.png">

    <!-- Fonts & Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900">

    <!-- Navbar -->
    <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-lg border-b border-emerald-800">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-full"><i data-lucide="music" class="text-emerald-900 w-5 h-5"></i></div>
                <a href="index.html" class="font-serif text-xl md:text-2xl font-bold">Koor AHM</a>
            </div>

            <!-- Desktop Links -->
            <div class="hidden md:flex items-center gap-6">
                <a href="index.html" class="hover:text-emerald-300" data-t="home">Home</a>
                <a href="calendar.html" class="hover:text-emerald-300" data-t="calendar">Kalender</a>
                <a href="contact.html" class="text-emerald-300 font-bold" data-t="contact">Contacto</a>
                <select id="langSelect" class="bg-emerald-800 text-white text-xs p-1 rounded lang-selector">
                    <option value="pap">PAP</option><option value="en">EN</option><option value="es">ES</option>
                </select>
            </div>

            <!-- Mobile Toggle -->
            <button class="md:hidden p-2" onclick="toggleMenu()">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden bg-emerald-800 border-t border-emerald-700 md:hidden px-4 py-6 space-y-4">
            <a href="index.html" class="block text-lg" data-t="home">Home</a>
            <a href="calendar.html" class="block text-lg" data-t="calendar">Kalender</a>
            <a href="contact.html" class="block text-lg font-bold" data-t="contact">Contacto</a>
            <select id="langSelectMobile" class="bg-emerald-900 text-white p-2 rounded w-full lang-selector">
                <option value="pap">PAP</option><option value="en">EN</option><option value="es">ES</option>
            </select>
        </div>
    </nav>

    <div class="py-12 md:py-20 max-w-4xl mx-auto px-4">
        <div id="contact-form-container">
            <header class="text-center mb-10 md:mb-16">
                <h1 class="text-3xl md:text-5xl font-bold text-stone-800 mb-4" data-t="contact_title">Tuma Contacto</h1>
                <p class="text-stone-500 max-w-lg mx-auto" data-t="contact_subtitle">Nos lo kier tende di bo. Sea bo kier uni cu nos koor of reserva nos pa un evento.</p>
            </header>

            <form id="contactForm" class="bg-white p-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] shadow-lg border space-y-4 md:space-y-6">
                <div class="grid md:grid-cols-2 gap-4 md:gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-2" data-t="full_name">Nomber</label>
                        <input type="text" id="contact-name" placeholder="E.g. Gianna Tromp" required
                            class="w-full p-3 md:p-4 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-2">Email</label>
                        <input type="email" id="contact-email" placeholder="bo_email@gmail.com" required
                            class="w-full p-3 md:p-4 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>
                </div>

                <!-- NEW: Optional Company Field -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-2">Compania (Opcional)</label>
                    <input type="text" id="contact-company" placeholder="Nomber di bo compania"
                        class="w-full p-3 md:p-4 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-2" data-t="message">Mensahe</label>
                    <textarea id="contact-message" rows="4" placeholder="Kico bo kier bisa nos?" required
                        class="w-full p-3 md:p-4 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all resize-none"></textarea>
                </div>

                <button type="submit" id="contact-submit-btn" class="w-full py-4 bg-emerald-900 text-white rounded-xl font-bold shadow-lg shadow-emerald-900/20 hover:bg-emerald-800 active:scale-[0.98] transition-all" data-t="send_message">
                    Manda Mensahe
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="hidden text-center bg-white p-12 md:p-20 rounded-[2rem] md:rounded-[3rem] shadow-xl border border-emerald-100">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full mb-8">
                <i data-lucide="check-circle-2" class="w-10 h-10"></i>
            </div>
            <h2 class="text-3xl font-serif font-bold text-stone-800 mb-4" data-t="message_sent">Mensahe Mandá!</h2>
            <p class="text-stone-600 mb-10 leading-relaxed max-w-md mx-auto" data-t="masha_danki">Masha danki pa tuma contacto. Nos a ricibi bo mensahe y lo contesta pronto.</p>
            <button onclick="location.reload()" class="py-4 px-10 bg-emerald-900 text-white rounded-2xl font-bold hover:bg-emerald-800 transition-all shadow-lg" data-t="send_another">
                Manda un otro mensahe
            </button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
